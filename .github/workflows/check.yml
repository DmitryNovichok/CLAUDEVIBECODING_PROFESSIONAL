name: Tests and build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 tools/check_repository.py
      - run: python3 tools/build_app.py --check
      - run: python3 tools/check_release.py
      - run: node --check app.js && node --check admin.js && node --check together.js && node --check lab-worker.js
      - run: node --test tests/*.test.cjs
      - run: timeout 900 python3 -m unittest discover -s tests
      - name: Synthetic classroom workload (temporary DB)
        run: python3 tools/load_lesson.py --students 30
      - name: Arduino dependencies
        run: npm ci --ignore-scripts
        working-directory: arduino/source
      - name: Arduino dependency audit
        run: npm audit --audit-level=high
        working-directory: arduino/source
      - name: Arduino build and tests
        run: npm run build && cmp dist/app.js ../app.js && npm test
        working-directory: arduino/source
      - name: Obfuscator dependencies
        run: npm ci --ignore-scripts
        working-directory: tools/obfuscate
      - name: Dependency audit
        run: npm audit --audit-level=high
        working-directory: tools/obfuscate
      - name: Source map regressions with build dependencies installed
        run: python3 -m unittest discover -s tests -p test_sourcemap.py
      - name: Minified and obfuscated copies for visitors (min/)
        run: python3 tools/minify.py --check && for f in min/*.js; do node --check "$f"; done
  browser:
    # Bundled Chromium needs unprivileged user namespaces with its sandbox enabled.
    # Migrate this runner before Ubuntu 22.04 retires on 2027-04-17.
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --ignore-scripts
        working-directory: tests/browser
      - name: Browser dependency audit
        run: npm audit --audit-level=high
        working-directory: tests/browser
      - name: Arduino browser harness dependencies
        run: npm ci --ignore-scripts
        working-directory: arduino/source
      - run: npx playwright install --with-deps chromium
        working-directory: tests/browser
      - name: Check Chromium sandbox
        run: |
          node - <<'JS'
          const {chromium} = require('@playwright/test');
          (async () => {
            const browser = await chromium.launch({headless: true, chromiumSandbox: true});
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          JS
        working-directory: tests/browser
      - run: npm test
        working-directory: tests/browser
      - name: Browser audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results
          path: |
            tests/browser/playwright-report/
            tests/browser/test-results/
            tests/browser/audit-summary.json
            tests/browser/results.json
          retention-days: 7
  python-runner:
    # Podman 4.9+ supports the mandatory environment/IPC isolation flags.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install and accept the rootless Python verifier
        run: |
          sudo --preserve-env=GITHUB_ACTIONS bash deploy/python-runner/ci-acceptance.sh \
            "$RUNNER_TEMP/python-runner-artifacts" "$GITHUB_SHA"
      - name: Real-container acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-runner-acceptance
          path: ${{ runner.temp }}/python-runner-artifacts/
          if-no-files-found: error
          retention-days: 14
