name: Tests and build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 tools/check_repository.py
      - run: python3 tools/build_app.py --check
      - run: node --check app.js && node --check admin.js && node --check together.js
      - run: timeout 900 python3 -m unittest discover -s tests
